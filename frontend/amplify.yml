version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
# Add a rewrite rule in the Amplify console for SPA routing:
#   Source: </^[^.]+$|\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff2?)$)([^.]+$)/>
#   Target: /index.html   Type: 200 (Rewrite)
